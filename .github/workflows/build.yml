name: Build PDF

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compile both templates
        uses: xu-cheng/latex-action@v4
        with:
          root_file: |
            template-academic.tex
            template-corporate.tex

      - name: Upload PDFs as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: minimalistic-cv-template
          path: template-*.pdf

      - name: Attach PDF to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: template-*.pdf
